services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nftscanner
      POSTGRES_PASSWORD: nftscanner
      POSTGRES_DB: nftscanner
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nftscanner"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nftscanner:nftscanner@db:5432/nftscanner
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

volumes:
  pgdata:
